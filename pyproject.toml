[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aetp-master"
version = "0.1.0"
description = "汽车电子测试平台（AETP）Master 主节点"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "dependency-injector>=4.41",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "pydantic>=2.7",
    "alembic>=1.13",

    "aiomqtt>=2.1",
    "aetp-protocol>=0.1.0",
    "python-multipart>=0.0.9",
    "croniter>=2.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "master*", "common*"]
exclude = ["tests*", "web*", "migrations*", "common.src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 默认启用 E/F（pyflakes+pycodestyle）+ 一组精选规则
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                 # isort 导入排序
    "UP",                # pyupgrade 现代化语法
    "B",                 # flake8-bugbear 常见陷阱
    "SIM",               # flake8-simplify 简化
    "C4",                # flake8-comprehensions 推导式
]
ignore = [
    # 面向用户的参数校验用 ValueError（HTTP 422），非 Python 类型错误
    "TRY004",
    # PYI 系列针对 stub 文件；普通业务代码的 __enter__/__exit__ 注解不适用
    "PYI034", "PYI036",
    # 测试断言与配置常量大量使用魔法数字，复杂度规则在本项目误报过高
    "PLR2004",
]
