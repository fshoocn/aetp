<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pytest 脚本上传</title>
  <link rel="stylesheet" href="vendor/element-plus.css">
  <style>
    body { margin: 0; min-width: 320px; background: #f4f7f8; font-family: "Aptos", "Microsoft YaHei UI", sans-serif; color: #182b36; }
    .workspace { max-width: 980px; margin: 0 auto; padding: 20px; }
    .intro { margin-bottom: 16px; }
    .kicker { color: #188c91; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
    .intro h1 { margin: 6px 0; font-size: 22px; letter-spacing: -.02em; }
    .intro p { margin: 0; color: #71818a; font-size: 12px; line-height: 1.65; }
    .mb0 { margin-bottom: 0 !important; }
    .cap-box textarea { font-family: ui-monospace, monospace; font-size: 11px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="workspace">
      <header class="intro">
        <div class="kicker">PYTEST / SCRIPT WORKSPACE</div>
        <h1>上传 pytest 测试脚本</h1>
        <p>脚本先在 Master 校验并解析用例，再按 Shard 分发到 Agent 执行。支持单个 Python 文件或 ZIP 工程包。</p>
      </header>
      <el-row :gutter="14">
        <el-col :xs="24" :md="13">
          <el-card shadow="never">
            <template #header><strong>脚本信息</strong></template>
            <el-form label-position="top" size="large">
              <el-form-item label="脚本名称" required>
                <el-input v-model="state.name" placeholder="例如：ADAS 冒烟回归" clearable />
              </el-form-item>
              <el-form-item label="脚本文件" required>
                <el-upload
                  drag
                  :auto-upload="false"
                  :limit="1"
                  :on-change="onFileChange"
                  :on-remove="() => state.file = null"
                  accept=".py,.zip"
                >
                  <el-icon class="el-icon--upload"><upload-filled /></el-icon>
                  <div class="el-upload__text">拖拽文件到这里，或 <em>点击选择</em></div>
                  <template #tip><div class="el-upload__tip">{{ uploadTip }}</div></template>
                </el-upload>
              </el-form-item>
              <el-form-item label="测试路径（可选）">
                <el-input v-model="testPath" placeholder="例如 tests 或 test_smoke.py" clearable />
              </el-form-item>
              <el-button type="primary" :disabled="!canUpload" :loading="state.uploading" @click="doUpload">
                {{ state.uploading ? "正在上传..." : "上传并解析" }}
              </el-button>
              <el-button @click="resetForm">重置</el-button>
            </el-form>
          </el-card>
        </el-col>
        <el-col :xs="24" :md="11">
          <el-card shadow="never">
            <template #header><strong>执行参数</strong></template>
            <el-form label-position="top" size="large">
              <el-form-item label="pytest 参数">
                <div v-for="(_, index) in pytestArgs" :key="index" style="display:flex; gap:8px; margin-bottom:8px;">
                  <el-input v-model="pytestArgs[index]" placeholder="例如 -q" />
                  <el-button type="danger" plain @click="removeAt('pytest_args', index)">删除</el-button>
                </div>
                <el-button plain @click="addArg">添加参数</el-button>
              </el-form-item>
              <el-form-item label="Python 解释器">
                <el-input v-model="pythonExecutable" placeholder="留空使用 Agent 当前 Python" clearable />
              </el-form-item>
              <el-row :gutter="10">
                <el-col :span="12">
                  <el-form-item label="执行超时（秒）"><el-input-number v-model="timeoutS" :min="1" :max="86400" controls-position="right" style="width:100%" /></el-form-item>
                </el-col>
                <el-col :span="12">
                  <el-form-item label="每 Shard 用例数"><el-input-number v-model="casesPerShard" :min="1" :max="1000" controls-position="right" style="width:100%" /></el-form-item>
                </el-col>
              </el-row>
              <el-form-item label="执行后上传的附件">
                <div v-for="(_, index) in artifactPaths" :key="index" style="display:flex; gap:8px; margin-bottom:8px;">
                  <el-input v-model="artifactPaths[index]" placeholder="例如 reports/*.html" />
                  <el-button type="danger" plain @click="removeAt('artifact_paths', index)">删除</el-button>
                </div>
                <el-button plain @click="addArtifact">添加附件路径</el-button>
              </el-form-item>
              <el-checkbox v-model="failFast">首个失败后停止当前 Shard</el-checkbox>
            </el-form>
          </el-card>
          <el-card shadow="never" style="margin-top:14px;">
            <template #header><strong>Agent 验证</strong></template>
            <el-select v-model="state.nodeId" placeholder="不执行台架验证" clearable style="width:100%">
              <el-option v-for="item in nodes" :key="item.node_id" :label="`${item.name || item.node_id} · ${item.node_id}`" :value="item.node_id" :disabled="!item.enabled || !item.online" />
            </el-select>
            <div style="margin-top:6px; color:#8b9aa1; font-size:11px;">{{ verifyHint }}</div>
            <el-input type="textarea" :rows="5" readonly :model-value="capabilityText" style="margin-top:10px;" class="cap-box" />
            <el-button type="primary" style="margin-top:10px; width:100%" :disabled="!canVerify" :loading="verifying" @click="doVerify">下发 Agent 验证</el-button>
          </el-card>
        </el-col>
      </el-row>
      <el-alert v-if="status.text" :title="status.text" :type="status.kind || 'info'" show-icon :closable="false" style="margin-top:14px;" />
    </div>
  </div>

  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/element-plus.js"></script>
  <script src="vendor/zh-cn.js"></script>
  <script src="vendor/icons.js"></script>
  <script>
    (() => {
      const { createApp, reactive, ref, computed, watch } = Vue;
      const app = createApp({
        setup() {
          const state = reactive({ context: null, config: {}, name: "", file: null, scriptId: "", nodeId: "", uploading: false });
          const status = reactive({ text: "", kind: "info" });
          const testPath = ref(""); const pythonExecutable = ref(""); const timeoutS = ref(undefined); const casesPerShard = ref(undefined);
          const failFast = ref(false); const pytestArgs = ref([]); const artifactPaths = ref([]); const verifying = ref(false);

          function send(type, payload) { window.parent.postMessage({ type, payload }, window.location.origin); }
          function setStatus(text, kind) { status.text = text; status.kind = kind || "info"; }
          function listValue(key) { return Array.isArray(state.config[key]) ? state.config[key].map(String) : []; }

          const uploadTip = computed(() => { const spec = state.context?.upload_spec || {}; const ext = Array.isArray(spec.extensions) ? spec.extensions.join(" / ") : ".py / .zip"; return `${ext}${spec.max_size_mb ? ` · 最大 ${spec.max_size_mb} MB` : ""}`; });
          const canUpload = computed(() => !!state.name.trim() && !!state.file && !state.uploading);
          const nodes = computed(() => state.context?.nodes || []);
          const verifySupported = computed(() => !!state.context?.verification?.supported);
          const canVerify = computed(() => !!state.scriptId && verifySupported.value && !!state.nodeId && !state.uploading && !verifying.value);
          const verifyHint = computed(() => verifySupported.value ? (state.scriptId ? "已上传脚本并选择节点，可以下发验证。" : "上传脚本后可以下发验证。") : "该插件由 Master 完成验证，无需下发 Agent 命令。");
          const capabilityText = computed(() => { const selected = nodes.value.find((n) => n.node_id === state.nodeId); return selected ? JSON.stringify(selected.capabilities || {}, null, 2) : "请选择验证节点查看能力"; });

          function syncConfigFromRefs() {
            state.config.pytest_args = pytestArgs.value.filter((v) => String(v).trim());
            state.config.artifact_paths = artifactPaths.value.filter((v) => String(v).trim());
            if (testPath.value.trim()) state.config.test_path = testPath.value.trim(); else delete state.config.test_path;
            if (pythonExecutable.value.trim()) state.config.python_executable = pythonExecutable.value.trim(); else delete state.config.python_executable;
            if (timeoutS.value != null) state.config.timeout_s = timeoutS.value; else delete state.config.timeout_s;
            if (casesPerShard.value != null) state.config.cases_per_shard = casesPerShard.value; else delete state.config.cases_per_shard;
            if (failFast.value) state.config.fail_fast = true; else delete state.config.fail_fast;
            sendConfig();
          }
          function sendConfig() { send("aetp.plugin.config", { config: state.config, node_id: state.nodeId }); }
          function applyContext(context) {
            state.context = context || {}; state.config = { ...(context?.config || {}) }; state.scriptId = context?.script_id || "";
            pytestArgs.value = listValue("pytest_args"); artifactPaths.value = listValue("artifact_paths");
            testPath.value = typeof state.config.test_path === "string" ? state.config.test_path : "";
            pythonExecutable.value = typeof state.config.python_executable === "string" ? state.config.python_executable : "";
            timeoutS.value = typeof state.config.timeout_s === "number" ? state.config.timeout_s : undefined;
            casesPerShard.value = typeof state.config.cases_per_shard === "number" ? state.config.cases_per_shard : undefined;
            failFast.value = state.config.fail_fast === true;
          }
          function onFileChange(file) {
            const max = Number(state.context?.upload_spec?.max_size_mb || 0);
            if (file.raw && max && file.raw.size > max * 1024 * 1024) { state.file = null; setStatus(`文件超过 ${max} MB 限制`, "error"); return; }
            state.file = file.raw || null;
          }
          function resetForm() { state.name = ""; state.file = null; state.scriptId = ""; state.config = {}; pytestArgs.value = []; artifactPaths.value = []; testPath.value = ""; pythonExecutable.value = ""; timeoutS.value = undefined; casesPerShard.value = undefined; failFast.value = false; setStatus("已重置上传表单", "info"); sendConfig(); }
          function doUpload() { if (!canUpload.value) return; state.uploading = true; setStatus("正在上传、校验并解析用例...", "warning"); send("aetp.plugin.upload", { name: state.name.trim(), filename: state.file.name, file: state.file, config: state.config }); }
          function doVerify() { verifying.value = true; setStatus("验证请求已发送，等待 Agent 回执...", "warning"); send("aetp.plugin.verify", { request_id: `verify-${Date.now()}`, script_id: state.scriptId, node_id: state.nodeId, config: state.config }); setTimeout(() => verifying.value = false, 3000); }
          function addArg() { pytestArgs.value.push("-q"); syncConfigFromRefs(); }
          function addArtifact() { artifactPaths.value.push(""); syncConfigFromRefs(); }
          function removeAt(key, index) { if (key === "pytest_args") pytestArgs.value.splice(index, 1); else artifactPaths.value.splice(index, 1); syncConfigFromRefs(); }

          watch([pytestArgs, artifactPaths], syncConfigFromRefs, { deep: true });
          watch([testPath, pythonExecutable, timeoutS, casesPerShard, failFast], syncConfigFromRefs);
          watch(() => state.nodeId, sendConfig);

          window.addEventListener("message", (event) => {
            if (event.source !== window.parent || event.origin !== window.location.origin) return;
            const message = event.data || {};
            if (message.type === "aetp.plugin.context") applyContext(message.payload?.context);
            if (message.type === "aetp.plugin.upload-result") {
              state.uploading = false;
              if (message.payload?.status === "success") {
                state.scriptId = message.payload?.script?.script_id || state.scriptId;
                setStatus(verifySupported.value ? "脚本已上传并解析成功，可以选择节点验证。" : "脚本已上传并完成 Master 验证。", "success");
              } else setStatus(Array.isArray(message.payload?.errors) ? message.payload.errors.join("；") : "脚本上传失败", "error");
            }
            if (message.type === "aetp.plugin.verify-dispatch") setStatus(message.payload?.message || "验证已下发", "warning");
            if (message.type === "aetp.plugin.verify-result") setStatus(message.payload?.errors?.length ? message.payload.errors.join("；") : "Agent 验证通过", message.payload?.errors?.length ? "error" : "success");
          });
          send("aetp.plugin.ready", { protocol_version: 1 });
          return { state, status, testPath, pythonExecutable, timeoutS, casesPerShard, failFast, pytestArgs, artifactPaths, verifying, uploadTip, canUpload, nodes, canVerify, verifyHint, capabilityText, onFileChange, resetForm, doUpload, doVerify, addArg, addArtifact, removeAt };
        },
      });
      app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
      for (const [name, component] of Object.entries(ElementPlusIconsVue)) app.component(name, component);
      app.mount("#app");
    })();
  </script>
</body>
</html>
