# 主节点配置（本目录即主节点的执行根目录）。
#
# [node] 节点自身：kind（master / slave，必填）、name（缺省取 kind）、
#                  install_root（缺省 plugins）、plugins（预装插件源，逗号分隔；
#                  源目录或 zip 交付包）
# [web]  传给 webapi 插件的 WebApiConfig 字段（host / port / access_log /
#        log_level / start_timeout / cors_origins …）
# 相对路径（install_root / plugins）按本文件所在目录解析。

[node]
kind = master
name = 主节点
install_root = plugins
plugins = webui

[web]
host = 127.0.0.1
port = 8080
