# 从节点配置（本目录即从节点的执行根目录）。
#
# [node] 节点自身配置：kind（master / slave，必填）、name（缺省取本机设备名）、
#        install_root（插件安装目录，缺省 plugins）、plugins（预装插件源，逗号分隔；
#        源目录或 zip 交付包）。相对路径按本文件所在目录解析。
# [web]  WebApiPlugin 经 appconfig 注入读取的 WebApiConfig 配置：
#        host / port / access_log / log_level / start_timeout / cors_origins。
#        cors_origins 用逗号分隔；* 表示允许任意来源，留空表示关闭 CORS。
# [heartbeat] 心跳插件（slave_plugins/heartbeat）配置：master_url（主模块地址，
#        必填）、path（心跳接口路径，缺省 /api/heartbeat）、interval（心跳间隔
#        秒数，缺省 5）、timeout（单次请求超时秒数，缺省 3）、max_backoff（失败
#        重试间隔上限秒数，缺省 60）。主模块不在线 / 掉线时自动退避重试。
# [db]   数据库服务（common/plugins/db）的 DbConfig：url（SQLAlchemy 异步连接串，
#        唯一换库入口；SQLite 相对库路径按本文件所在目录解析，默认落
#        data/aetp.db）、echo（SQL 日志）、pool_size / max_overflow / pool_recycle
#        （非 SQLite 连接池）、orphan_policy（孤儿表处置：warn / drop）、
#        data_dir（归属登记目录，留空取库文件所在目录）、schema_log_limit
#        （结构变更日志保留上限）。主从各用各库，不共享。
#        ⚠️ 账号密码两种写法：直接写在 url 里
#        （postgresql+asyncpg://user:pass@host:5432/aetp），或用 env:DB_URL
#        从环境变量取（密码不落 config.ini）；配置查看接口对密码掩码为 ***。

[node]
kind = slave
name = 从节点
install_root = plugins
plugins = ../slave_plugins/heartbeat

[web]
host = 127.0.0.1
port = 8081
access_log = false
log_level = warning
start_timeout = 10.0
# ⚠️ 节点通信令牌（X-AETP-Token，必填）：从节点上报心跳等机器通道凭证；
#    [heartbeat] auth_token 可单独指定，留空则取本节点 [web] 的令牌。
auth_token = aetp-dev-token
cors_origins = *

[heartbeat]
master_url = http://127.0.0.1:8080
interval = 5.0
timeout = 3.0
max_backoff = 60.0

[db]
url = sqlite+aiosqlite:///data/aetp.db
#url = postgresql+asyncpg://user:pass@localhost:5432/aetp    # 换库示例：账号密码写在连接串里
#url = env:DB_URL                                            # 或从环境变量取连接串（密码不落 config.ini）
echo = false
pool_size = 5
max_overflow = 10
pool_recycle = 300
orphan_policy = warn
data_dir =
schema_log_limit = 500

[log]
#        日志（common/plugins/log）：level（debug/info/warn/error）、console（控制台输出）、
#        file（轮转文件，相对节点目录；留空关闭）、max_bytes（单文件上限）、backup_count（轮转份数）
level = info
console = true
file = data/logs/aetp.log
max_bytes = 5242880
backup_count = 3
store = data/logs/log.sqlite
report = true
report_level = info
retain_days = 7
retain_max_rows = 500000

[comm]
#        主从通信（common/plugins/comm）：target = 主节点基地址（从节点上报目标——
#        日志等数据经此批量上报；留空 = 本节点即汇聚点，只走本地自环不上报）；
#        批量与退避参数详见 common/plugins/comm/README.md
target = http://127.0.0.1:8080
batch_interval = 2.0
batch_size = 200
queue_max = 2000
retry_base = 1.0
retry_cap = 60.0
