[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aetp-protocol"
version = "0.1.0"
description = "AETP 共享协议包：Envelope / topics / payloads / golden messages（D-01，§4.6）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typing-extensions>=4.12",
    "rfc8785>=0.1.4",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["aetp_protocol"]
